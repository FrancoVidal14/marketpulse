name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test core-api
        working-directory: core-api
        run: ./mvnw verify

      - name: Test ingestor-service
        working-directory: ingestor-service
        run: ./mvnw verify

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push core-api
        uses: docker/build-push-action@v6
        with:
          context: core-api
          push: true
          tags: |
            ghcr.io/francovidal14/marketpulse-core-api:latest
            ghcr.io/francovidal14/marketpulse-core-api:${{ github.sha }}

      - name: Build and push ingestor-service
        uses: docker/build-push-action@v6
        with:
          context: ingestor-service
          push: true
          tags: |
            ghcr.io/francovidal14/marketpulse-ingestor-service:latest
            ghcr.io/francovidal14/marketpulse-ingestor-service:${{ github.sha }}